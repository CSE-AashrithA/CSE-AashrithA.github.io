<!DOCTYPE html>
<html>
    <head>
        <title>Assignment 5 - JavaScript</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div id="content">
            <header id="main-header">
                <h1>Assignment 5</h1>
                <p>Introduction to JavaScript</p>
                <span id="main-dots">•••</span>
            </header>

            <main>
                <div class="columns">
                    <section class="project-card" id="speech-card">
                        <span class="card-dots">•••</span>
                        <h2>Speech</h2>

                        <div id="speech-bubble">Hi</div>
                    </section>

                    <section class="project-card">
                        <span class="card-dots">•••</span>
                        <h2>Beverage</h2>

                        <div class="input-row">
                            <label for="beverages">Pick your morning beverage:</label>

                            <select id="beverages">
                                <option value="Coffee">Coffee</option>
                                <option value="Orange Juice">Orange Juice</option>
                                <option value="Tea">Tea</option>
                                <option value="Water">Water</option>
                            </select>
                        </div>

                        <p id="beverage-message"></p>
                    </section>

                    <section class="project-card">
                        <span class="card-dots">•••</span>
                        <h2>Add a Sticker</h2>

                        <div id="sun-container">
                            <span id="sticker">🌼</span>
                            <img id="sun" src="sun.png" alt="Smiling sun">
                        </div>
                    </section>
                </div>
            </main>

            <footer>
                <p>@aashrithatluri.com</p>
            </footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
